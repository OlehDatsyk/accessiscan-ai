[project]
name = "accessiscan-ai-backend"
version = "1.0.0"
description = "AccessiScan AI - automated web accessibility auditing API and scanner worker"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["E501", "S101", "B008", "S311", "ASYNC230", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["browser: launches a real Chromium browser via Playwright"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app"]
