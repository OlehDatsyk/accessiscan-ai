name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, PostgreSQL + SQLite tests, scanner & SSRF tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: accessiscan
          POSTGRES_PASSWORD: accessiscan_ci
          POSTGRES_DB: accessiscan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U accessiscan -d accessiscan_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      # Throwaway CI-only credentials. AI providers are mocked; no secrets are required.
      TEST_DATABASE_URL: postgresql+psycopg://accessiscan:accessiscan_ci@127.0.0.1:5432/accessiscan_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check app tests
      - name: Migrations (upgrade, drift check, downgrade, upgrade) on PostgreSQL
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
          alembic downgrade base
      - name: Tests on PostgreSQL (unit, auth, API, real-browser scanner, SSRF, AI mocked)
        run: pytest -q
      - name: Tests on SQLite
        run: TEST_DATABASE_URL= pytest -q

  frontend:
    name: Frontend (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: ESLint (incl. jsx-a11y)
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end + accessibility (Playwright + axe-core)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend environment
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Playwright tests (desktop + mobile, axe on every page)
        working-directory: frontend
        env:
          CI: "true"
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
