# Render Blueprint for AccessiScan AI.
#
# Architecture (simplest reliable setup that runs on Render's free tier):
#   accessiscan-ai-api       Docker web service (FastAPI + EMBEDDED scan worker with Playwright/Chromium)
#   accessiscan-ai-frontend  Static site (React build)
#
# DEMO MODE (current): no database server. EPHEMERAL_DEMO=true lets the API keep its data in a SQLite file on
# the free instance's disk, which Render WIPES on every restart, redeploy and idle spin-down (~15 min). The app
# shows a permanent "data is temporary" banner. (This workspace's single free PostgreSQL slot is already in use.)
#
# For persistent data use PostgreSQL and remove EPHEMERAL_DEMO:
#   - Render-managed: add
#       databases:
#         - name: accessiscan-ai-db
#           databaseName: accessiscan
#           plan: basic-256mb      # or free, if the workspace's free PostgreSQL slot is unused
#           region: frankfurt
#     and replace the DATABASE_URL entry with
#       fromDatabase: { name: accessiscan-ai-db, property: connectionString }
#   - external (e.g. Neon): set DATABASE_URL to `sync: false` and paste the URL in the dashboard.
#
# Why Docker: the native Python runtime does not include Chromium's OS libraries. The image is based on
# mcr.microsoft.com/playwright/python, which contains the matching browser and dependencies.
#
# Why an embedded worker: Render background workers are not available on the free plan. The API process
# starts the DB-backed job-queue worker in a separate thread (RUN_EMBEDDED_WORKER=true); scans never run
# inside an HTTP request. On a paid plan with PostgreSQL, uncomment the dedicated worker below and set
# RUN_EMBEDDED_WORKER=false on the API (a separate worker cannot share an ephemeral SQLite file).
#
# Plan notes: the free web service has 512 MB RAM and 0.1 CPU and sleeps after ~15 minutes of inactivity.
# Single-page scans work but are slow; crawls of heavy sites can exhaust memory. "starter" or "standard"
# is recommended for regular use.

services:
  - type: web
    name: accessiscan-ai-api
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health/ready
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./accessiscan-demo.db # temporary demo data - see the header comment
      - key: EPHEMERAL_DEMO
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://accessiscan-ai-frontend.onrender.com
      - key: FRONTEND_URL
        value: https://accessiscan-ai-frontend.onrender.com
      - key: TRUSTED_PROXY_HEADERS
        value: "true"
      - key: DOCS_ENABLED
        value: "true"
      - key: REGISTRATION_ENABLED
        value: "true"
      - key: RUN_EMBEDDED_WORKER
        value: "true"
      - key: SCAN_MAX_CONCURRENCY
        value: "1"
      - key: SCAN_MAX_PAGES
        value: "5"
      - key: SCAN_TIMEOUT_SECONDS
        value: "240"
      - key: SCAN_PAGE_TIMEOUT_SECONDS
        value: "45"
      - key: SCAN_USER_MAX_ACTIVE
        value: "1"
      - key: SCAN_USER_HOURLY_LIMIT
        value: "6"
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: AI_PROVIDER
        value: none # set to openai, anthropic or gemini AND add the matching key to enable AI
      - key: AI_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: accessiscan-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: VITE_API_URL
        value: https://accessiscan-ai-api.onrender.com
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://accessiscan-ai-api.onrender.com; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer

  # Dedicated scanner worker (paid plans only - Render background workers have no free tier).
  # - type: worker
  #   name: accessiscan-ai-worker
  #   runtime: docker
  #   region: frankfurt
  #   plan: starter
  #   rootDir: backend
  #   dockerfilePath: ./Dockerfile
  #   dockerContext: .
  #   dockerCommand: ./docker-entrypoint.sh worker
  #   envVars:
  #     - key: ENVIRONMENT
  #       value: production
  #     - key: DATABASE_URL
  #       fromDatabase: { name: accessiscan-ai-db, property: connectionString }
  #     - key: SECRET_KEY
  #       fromService: { type: web, name: accessiscan-ai-api, envVarKey: SECRET_KEY }
